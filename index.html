<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给妮妮的告白</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top, #ffe4f0 0%, #ffd1e3 35%, #f6b3d0 70%, #f08bb8 100%);
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding-top: 18vh;
            color: #fff5fb;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            letter-spacing: 2px;
            animation: fadeIn 2s ease-in;
            text-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        p {
            font-size: 1.3em;
            margin-bottom: 30px;
            animation: fadeIn 2s ease-in 1s both;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .heart-button {
            background: linear-gradient(135deg, #ff7aa2, #ff4b6e);
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 2s ease-in 2s both;
            box-shadow: 0 10px 25px rgba(255, 91, 134, 0.5);
        }

        .heart-button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 14px 30px rgba(255, 91, 134, 0.7);
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.97);
            padding: 40px 32px;
            border-radius: 24px;
            text-align: center;
            color: #333;
            display: none;
            z-index: 10;
            box-shadow: 0 18px 45px rgba(0,0,0,0.28);
            max-width: 90%;
            width: 420px;
        }

        .message h2 {
            color: #ff4b6e;
            margin-bottom: 14px;
            font-size: 2.3em;
        }

        .message p {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 26px;
            line-height: 1.8;
        }

        .close-btn {
            background: linear-gradient(135deg, #ff88b7, #ff4b6e);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 1em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .floating-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255,255,255,0.8);
            font-size: 20px;
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="content">
        <h1>❤️ 妮妮，这是写给你的 ❤️</h1>
        <p>从遇见你的那一刻起，我的世界就开始偷偷偏向你了</p>
        <button class="heart-button" onclick="showMessage()">点一点，看看我的心里话</button>
    </div>

    <div class="message" id="message">
        <h2>妮妮，我喜欢你</h2>
        <p>我很庆幸，在茫茫人海里遇见了你。<br>
        你的名字、你的笑、你说过的每一句话，<br>
        都在我心里反复重播，怎么也看不腻。<br>
        未来的日子，我想和你一起看很多风景、<br>
        吃很多好吃的、一起走过很多普通却又特别的日子。<br>
        妮妮，愿不愿意，把你的今天和明天，都交给我来认真守护？</p>
        <button class="close-btn" onclick="hideMessage()">我愿意听你慢慢说下去</button>
    </div>

    <script>
        // Canvas设置
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 爱心粒子系统
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.color = `hsl(${Math.random() * 60 + 300}, 70%, 60%)`;
                this.life = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.01;
                this.size *= 0.99;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制爱心形状
                if (this.size > 3) {
                    ctx.fillStyle = '#ff6b6b';
                    ctx.font = `${this.size * 2}px Arial`;
                    ctx.fillText('❤️', this.x - this.size, this.y - this.size);
                }
                ctx.restore();
            }
        }

        let particles = [];

        // 创建粒子
        function createParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x, y));
            }
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 更新和绘制粒子
            particles = particles.filter(particle => {
                particle.update();
                particle.draw();
                return particle.life > 0;
            });
            
            // 随机创建新粒子
            if (Math.random() < 0.1) {
                createParticles(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                );
            }
            
            requestAnimationFrame(animate);
        }

        // 鼠标交互
        canvas.addEventListener('mousemove', (e) => {
            createParticles(e.clientX, e.clientY);
        });

        // 创建飘浮爱心
        function createFloatingHearts() {
            const heartsContainer = document.getElementById('floatingHearts');
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = '100%';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                
                heartsContainer.appendChild(heart);
                
                // 移除旧的爱心
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 500);
        }

        // 显示消息
        function showMessage() {
            document.getElementById('message').style.display = 'block';
            
            // 创建庆祝粒子
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createParticles(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height
                    );
                }, i * 50);
            }
        }

        // 隐藏消息
        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 启动动画
        animate();
        createFloatingHearts();

        // 添加背景音乐（可选）
        // const audio = new Audio(' romantic-music.mp3');
        // audio.loop = true;
        // audio.volume = 0.3;
        // document.addEventListener('click', () => {
        //     audio.play();
        // }, { once: true });
    </script>
</body>
</html>
